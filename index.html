<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mentor &amp; Match Student</title>
    <meta name="description" content="Mentoring Students Virtually Anywhere. Mentor &amp; Match virtual mentoring platform allows colleges to leverage the community through mentoring." />
    <meta name="theme-color" content="#203d64" />
    <meta name="application-name" content="Mentor &amp; Match Student" />
    <meta name="apple-mobile-web-app-title" content="Mentor &amp; Match" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Mentor &amp; Match Student" />
    <meta property="og:description" content="Find your mentor. Shape your future." />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark-blue.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The landing page's logo and fonts start downloading alongside the script, not after it. -->
    <link rel="preload" as="image" type="image/svg+xml" href="/brand/logo.svg" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/gilroy-bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/gilroy-semibold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/gilroy-regular.woff2" crossorigin />
    <!-- Loading screen: plain HTML so the Mentor & Match logo shows the instant the page starts loading,
         on every visit and refresh. The app fades it out once its first screen is ready (BootSplash). -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: linear-gradient(to bottom, #203d64, #3c6a97); transition: opacity 0.3s; }
      @media (min-width: 520px) { #boot { left: 50%; right: auto; width: 430px; margin-left: -215px; } }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .c { position: relative; width: 192px; height: 192px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 24px 50px rgba(5, 15, 35, 0.35); }
      #boot .c::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.4); animation: boot-ring 2s ease-out infinite; }
      #boot img { width: 116px; height: auto; }
      @keyframes boot-ring { from { transform: scale(1); opacity: 0.55; } to { transform: scale(1.9); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot .c::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Mentor &amp; Match Student">
      <div class="c"><img src="/brand/logo.svg" alt="Mentor &amp; Match" width="116" height="73" fetchpriority="high" /></div>
    </div>
    <div id="root"></div>
    <noscript>Mentor &amp; Match Student needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
